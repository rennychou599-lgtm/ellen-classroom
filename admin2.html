<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九年一班管理介面 (UI/UX 測試) | 鈺倫の教室</title>
    <link rel="icon" type="image/png" href="images2/Ellennoback.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 登入模态框样式 - 已隱藏，僅保留樣式以防需要 */
        .login-modal {
            display: none !important;
        }

        /* 移除 Logo 區域的懸停效果 */
        .site-branding .logo-link:hover {
            opacity: 1 !important;
            cursor: default !important;
        }

        .site-branding .logo-link {
            pointer-events: none;
        }

        .site-branding .logo-link * {
            pointer-events: none;
        }

        /* Header Actions 樣式 */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
            margin-left: auto;
        }

        /* 登出按鈕樣式 - 紅色明顯 */
        .btn-logout {
            background: #dc3545 !important;
            color: white !important;
            border: 2px solid #dc3545 !important;
            font-weight: 600 !important;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3) !important;
            padding: 0.65rem 1.25rem !important;
            border-radius: 8px !important;
            font-size: 0.9rem !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.4rem !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            white-space: nowrap !important;
        }

        .btn-logout:hover {
            background: #c82333 !important;
            border-color: #c82333 !important;
            transform: translateY(-1px) !important;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4) !important;
        }

        .btn-logout:active {
            transform: translateY(0) !important;
            box-shadow: 0 2px 6px rgba(220, 53, 69, 0.3) !important;
        }

        .btn-logout i {
            color: white !important;
            font-size: 0.85rem !important;
        }

        /* 班級選擇器樣式 */
        .class-selector {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-left: 1.5rem;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.98) 100%);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.06),
                0 1px 3px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .class-selector-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .class-selector-label i {
            color: #6366f1;
            font-size: 1rem;
        }

        .class-select {
            padding: 0.5rem 1rem;
            border: 1.5px solid rgba(226, 232, 240, 0.8);
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #1e293b;
            min-width: 140px;
        }

        .class-select:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.95);
            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.1),
                0 4px 12px rgba(99, 102, 241, 0.15);
        }

        .class-select:hover {
            border-color: #6366f1;
            transform: translateY(-1px);
        }

        .class-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.875rem;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
            margin-left: 0.5rem;
        }

        .class-badge i {
            font-size: 0.75rem;
        }

        .admin-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fb 0%, #e8ecf1 50%, #f0f4f8 100%);
            padding: 2rem;
            position: relative;
        }

        .admin-page::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .admin-container {
            position: relative;
            z-index: 1;
        }



        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.98) 100%);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.75rem;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.06),
                0 1px 3px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 4px solid;
            border-image: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%) 1;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow:
                0 12px 32px rgba(99, 102, 241, 0.15),
                0 4px 12px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .stat-value {
            color: #1e293b;
            font-size: 2.25rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .stat-icon {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.25rem;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 2px 4px rgba(99, 102, 241, 0.2));
        }

        /* 標籤頁樣式 */
        .admin-tabs {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.98) 100%);
            backdrop-filter: blur(10px);
            padding: 0.75rem;
            border-radius: 16px;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.06),
                0 1px 3px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .tab-btn {
            flex: 1;
            padding: 1rem 1.75rem;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            position: relative;
        }

        .tab-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(139, 92, 246, 0.08) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .tab-btn:hover {
            color: #475569;
            transform: translateY(-1px);
        }

        .tab-btn:hover::before {
            opacity: 1;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            color: white;
            box-shadow:
                0 4px 16px rgba(99, 102, 241, 0.35),
                0 2px 8px rgba(139, 92, 246, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .tab-btn.active::before {
            opacity: 0;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .admin-content {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.98) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.08),
                0 2px 8px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .content-header h2 {
            color: #1e293b;
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .search-filter {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.875rem 1.125rem 0.875rem 2.75rem;
            border: 1.5px solid rgba(226, 232, 240, 0.8);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #1e293b;
        }

        .search-box input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.95);
            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.1),
                0 4px 12px rgba(99, 102, 241, 0.15);
            transform: translateY(-1px);
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            transition: color 0.3s ease;
        }

        .search-box input:focus+i {
            color: #6366f1;
        }

        .filter-select {
            padding: 0.875rem 1.25rem;
            border: 1.5px solid rgba(226, 232, 240, 0.8);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #1e293b;
        }

        .filter-select:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.95);
            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.1),
                0 4px 12px rgba(99, 102, 241, 0.15);
            transform: translateY(-1px);
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .students-table thead {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.2);
        }

        .students-table th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .students-table td {
            padding: 1rem;
            border-bottom: 1px solid #e1e8ed;
        }

        .students-table tbody tr {
            transition: all 0.2s ease;
        }

        .students-table tbody tr:hover {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.04) 0%, rgba(139, 92, 246, 0.04) 100%);
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.08);
        }

        .students-table tbody tr:last-child td {
            border-bottom: none;
        }

        .student-id {
            font-weight: 600;
            color: #2c3e50;
        }

        .student-name {
            color: #2c3e50;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            min-width: 80px;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            padding: 0.625rem;
            border: none;
            background: rgba(99, 102, 241, 0.08);
            color: #6366f1;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem;
        }

        .btn-icon:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
            color: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            color: white;
            border: none;
            padding: 0.875rem 1.75rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.625rem;
            box-shadow:
                0 4px 16px rgba(99, 102, 241, 0.3),
                0 2px 8px rgba(139, 92, 246, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 24px rgba(99, 102, 241, 0.4),
                0 4px 12px rgba(139, 92, 246, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #5a6c7d;
        }

        .loading i {
            font-size: 3rem;
            color: #667eea;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #5a6c7d;
        }

        .empty-state i {
            font-size: 4rem;
            color: #e1e8ed;
            margin-bottom: 1rem;
        }

        /* 成績管理樣式 */
        .grades-management {
            margin-top: 1.5rem;
        }

        .student-selector {
            margin-bottom: 1.5rem;
        }

        .student-selector label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .grades-list {
            margin-top: 1.5rem;
        }

        .grade-item {
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.8) 0%, rgba(241, 245, 249, 0.9) 100%);
            backdrop-filter: blur(10px);
            border-left: 4px solid;
            border-image: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%) 1;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }

        .grade-item:hover {
            transform: translateX(6px) translateY(-2px);
            box-shadow:
                0 8px 20px rgba(99, 102, 241, 0.15),
                0 4px 12px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .grade-info {
            flex: 1;
        }

        .grade-info h4 {
            color: #2c3e50;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .grade-info p {
            color: #5a6c7d;
            font-size: 0.9rem;
            margin: 0.25rem 0;
        }

        .grade-score {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 1rem;
            filter: drop-shadow(0 2px 4px rgba(99, 102, 241, 0.2));
        }

        .grade-actions {
            display: flex;
            gap: 0.5rem;
        }

        /* 訊息管理樣式 */
        .message-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .message-tab-btn {
            padding: 0.5rem 1rem;
            border: 2px solid #e1e8ed;
            background: white;
            color: #5a6c7d;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .message-tab-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .message-tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .message-content {
            display: none;
            margin-top: 1.5rem;
        }

        .message-content.active {
            display: block;
        }

        .messages-list {
            margin-top: 1.5rem;
        }

        .message-item {
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.8) 0%, rgba(241, 245, 249, 0.9) 100%);
            backdrop-filter: blur(10px);
            border-left: 4px solid;
            border-image: linear-gradient(135deg, #10b981 0%, #14b8a6 100%) 1;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }

        .message-item:hover {
            transform: translateX(6px) translateY(-2px);
            box-shadow:
                0 8px 20px rgba(16, 185, 129, 0.15),
                0 4px 12px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .message-student {
            font-weight: 600;
            color: #2c3e50;
            font-size: 1rem;
        }

        .message-date {
            color: #5a6c7d;
            font-size: 0.85rem;
        }

        .message-subject {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 0.375rem 0.875rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
        }

        .message-content-text {
            color: #2c3e50;
            line-height: 1.6;
            margin-top: 0.5rem;
        }

        /* 模态框樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: white;
            border-radius: 16px;

    <script>
        let allStudents = [];

        let authToken = 'test-token-for-ui-ux';

        const mockStudentsByClass = {

        // 獲取當前班級的學生資料
        function getCurrentClassStudents() {
            return mockStudentsByClass[currentClass] || mockStudentsByClass['901'];
        }

        // 檢查登入狀態 - 測試模式直接顯示內容
        function checkAuth() {
            // 直接顯示內容，不需要驗證
            document.getElementById('adminContent').style.display = 'block';
            // 載入測試資料（使用當前班級）
            allStudents = getCurrentClassStudents();
            displayStudents(allStudents);
            updateStats(allStudents);
        }

        // 載入學生資料 - 測試模式使用假資料
        async function loadStudents() {
            // 使用當前班級的假資料
            allStudents = getCurrentClassStudents();
            displayStudents(allStudents);
            updateStats(allStudents);
        }

        // 顯示學生列表
        function displayStudents(students) {
            const container = document.getElementById('studentsContainer');

            if (students.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-slash"></i>
                        <p>目前沒有學生資料</p>
                    </div>
                `;
                return;
            }

            const tableHTML = `
                <table class="students-table">
                    <thead>
                        <tr>
                            <th>學號</th>
                            <th>姓名</th>
                            <th>狀態</th>
                            <th>最後登入</th>
                            <th>作業完成度</th>
                            <th>平均成績</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${students.map(student => `
                            <tr>
                                <td class="student-id">${student.student_id || '-'}</td>
                                <td class="student-name">${student.student_name || '-'}</td>
                                <td>
                                    <span class="status-badge ${getStatusClass(student.status)}">
                                        ${getStatusText(student.status)}
                                    </span>
                                </td>
                                <td>${formatDate(student.last_login) || '從未登入'}</td>
                                <td>${student.completion_rate || 0}%</td>
                                <td>${student.average_grade || '-'}</td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-icon" onclick="viewStudent('${student.student_id}')" title="查看詳情">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <button class="btn-icon" onclick="editStudent('${student.student_id}')" title="編輯">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            container.innerHTML = tableHTML;
        }

        // 更新統計數據
        function updateStats(students) {
            const total = students.length;
            const active = students.filter(s => s.status === 'active').length;
            const pending = students.filter(s => s.status === 'pending').length;

            // 計算平均成績
            const grades = students.filter(s => s.average_grade && !isNaN(s.average_grade))
                .map(s => parseFloat(s.average_grade));
            const avgGrade = grades.length > 0
                ? (grades.reduce((a, b) => a + b, 0) / grades.length).toFixed(1)
                : '-';

            document.getElementById('totalStudents').textContent = total;
            document.getElementById('activeStudents').textContent = active;
            document.getElementById('pendingStudents').textContent = pending;
            document.getElementById('avgGrade').textContent = avgGrade;
        }

        // 獲取狀態樣式
        function getStatusClass(status) {
            switch (status) {
                case 'active':
                    return 'status-active';
                case 'inactive':
                    return 'status-inactive';
                case 'pending':
                    return 'status-pending';
                default:
                    return 'status-inactive';
            }
        }

        // 獲取狀態文字
        function getStatusText(status) {
            switch (status) {
                case 'active':
                    return '在線';
                case 'inactive':
                    return '離線';
                case 'pending':
                    return '待處理';
                default:
                    return '未知';
            }
        }

        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return null;
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 搜尋和篩選學生
        function filterStudents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            let filtered = allStudents.filter(student => {
                const matchSearch = !searchTerm ||
                    (student.student_name && student.student_name.toLowerCase().includes(searchTerm)) ||
                    (student.student_id && student.student_id.toLowerCase().includes(searchTerm));

                const matchStatus = statusFilter === 'all' || student.status === statusFilter;

                return matchSearch && matchStatus;
            });

            displayStudents(filtered);
        }

        // 重新整理
        function refreshStudents() {
            document.getElementById('studentsContainer').innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>載入中...</p>
                </div>
            `;
            loadStudents();
        }

        // 查看學生詳情
        function viewStudent(studentId) {
            alert(`查看學生 ${studentId} 的詳情（UI/UX 測試模式）`);
        }

        // 編輯學生
        function editStudent(studentId) {
            alert(`編輯學生 ${studentId}（UI/UX 測試模式）`);
        }

        // 標籤頁切換
        function switchTab(tabName) {
            // 隱藏所有標籤頁內容
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // 移除所有按鈕的 active 狀態
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // 顯示選中的標籤頁
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

            // 根據標籤頁載入對應資料
            if (tabName === 'grades') {
                loadStudentsForGrades();
            } else if (tabName === 'messages') {
                loadStudentsForMessages();
                loadStudentReflections();
            }
        }

        // 訊息標籤頁切換
        function switchMessageTab(tabName) {
            document.querySelectorAll('.message-content').forEach(content => {
                content.classList.remove('active');
            });

            document.querySelectorAll('.message-tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(`message-${tabName}`).classList.add('active');
            document.querySelector(`[data-message-tab="${tabName}"]`).classList.add('active');

            if (tabName === 'reflections') {
                loadStudentReflections();
            } else if (tabName === 'feedback') {
                loadAllFeedback();
            }
        }

        // 載入學生列表（用於成績管理）
        function loadStudentsForGrades() {
            const select = document.getElementById('gradeStudentSelect');
            select.innerHTML = '<option value="">請選擇學生</option>';

            allStudents.forEach(student => {
                const option = document.createElement('option');
                option.value = student.student_id;
                option.textContent = `${student.student_id} - ${student.student_name}`;
                select.appendChild(option);
            });
        }

        // 載入學生列表（用於訊息管理）
        function loadStudentsForMessages() {
            const select = document.getElementById('reflectionStudentSelect');
            select.innerHTML = '<option value="">全部學生</option>';

            allStudents.forEach(student => {
                const option = document.createElement('option');
                option.value = student.student_id;
                option.textContent = `${student.student_id} - ${student.student_name}`;
                select.appendChild(option);
            });
        }

        // 載入學生成績 - 測試模式
        async function loadStudentGrades() {
            const studentId = document.getElementById('gradeStudentSelect').value;
            const container = document.getElementById('gradesContainer');

            if (!studentId) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-chart-line"></i>
                        <p>請先選擇學生查看成績</p>
                    </div>
                `;
                return;
            }

            // 測試用假成績資料
            const mockGrades = [
                { id: 1, subject: '國文', score: 88, comment: '表現良好', exam_date: '2025-01-10' },
                { id: 2, subject: '英文', score: 92, comment: '進步明顯', exam_date: '2025-01-12' },
                { id: 3, subject: '數學', score: 85, comment: '需要加強', exam_date: '2025-01-14' }
            ];

            container.innerHTML = mockGrades.map(grade => `
                <div class="grade-item">
                    <div class="grade-info">
                        <h4>${grade.subject}</h4>
                        <p>${grade.comment || '無評語'}</p>
                        <p style="font-size: 0.85rem; color: #8899a6;">
                            <i class="fas fa-calendar"></i>
                            ${grade.exam_date ? new Date(grade.exam_date).toLocaleDateString('zh-TW') : '未設定日期'}
                        </p>
                    </div>
                    <div class="grade-score">${grade.score}</div>
                    <div class="grade-actions">
                        <button class="btn-icon" onclick="editGrade('${grade.id || ''}', '${studentId}')" title="編輯">
                            <i class="fas fa-edit"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 載入學生學習心得 - 測試模式
        async function loadStudentReflections() {
            const studentId = document.getElementById('reflectionStudentSelect')?.value || '';
            const container = document.getElementById('reflectionsContainer');

            // 測試用假資料
            const mockReflections = [
                { id: 1, student_id: 'S001', date: '2025-01-15', subject: '數學', content: '今天學習了代數，感覺很有收穫！' },
                { id: 2, student_id: 'S002', date: '2025-01-14', subject: '英文', content: '背了很多單字，希望考試能有好成績。' },
                { id: 3, student_id: 'S003', date: '2025-01-13', subject: '國文', content: '閱讀理解需要多練習。' }
            ];

            const studentMap = {};
            allStudents.forEach(s => {
                studentMap[s.student_id] = s.student_name;
            });

            const filtered = studentId
                ? mockReflections.filter(r => r.student_id === studentId)
                : mockReflections;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-lightbulb"></i>
                        <p>尚無學習心得記錄</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(reflection => `
                <div class="message-item">
                    <div class="message-header">
                        <span class="message-student">
                            ${studentMap[reflection.student_id] || reflection.student_id}
                        </span>
                        <span class="message-date">
                            ${new Date(reflection.date).toLocaleDateString('zh-TW')}
                        </span>
                    </div>
                    <span class="message-subject">${reflection.subject}</span>
                    <div class="message-content-text">${reflection.content}</div>
                </div>
            `).join('');
        }

        // 載入所有待回覆訊息 - 測試模式
        async function loadAllFeedback() {
            const container = document.getElementById('feedbackContainer');

            // 測試用假資料
            const mockFeedbacks = [
                { id: 1, student_id: 'S001', student_name: '王小明', title: '關於作業問題', content: '老師，我想請問作業的第三題該如何解答？', created_at: '2025-01-15', is_read: false },
                { id: 2, student_id: 'S002', student_name: '李小華', title: '考試範圍確認', content: '請問這次考試的範圍是什麼？', created_at: '2025-01-14', is_read: true }
            ];

            if (mockFeedbacks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-envelope"></i>
                        <p>尚無待回覆訊息</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = mockFeedbacks.map(fb => `
                <div class="message-item">
                    <div class="message-header">
                        <span class="message-student">${fb.student_name || fb.student_id}</span>
                        <span class="message-date">
                            ${new Date(fb.created_at).toLocaleDateString('zh-TW')}
                        </span>
                    </div>
                    <h4 style="color: #2c3e50; margin-bottom: 0.5rem;">${fb.title}</h4>
                    <div class="message-content-text">${fb.content}</div>
                    ${!fb.is_read ? '<span style="display: inline-block; background: #ff6b6b; color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-top: 0.5rem;">未讀</span>' : ''}
                </div>
            `).join('');
        }

        // 打開新增成績模态框
        function openAddGradeModal() {
            const modal = document.getElementById('addGradeModal');
            const select = document.getElementById('gradeStudentId');

            // 載入學生列表
            select.innerHTML = '<option value="">請選擇學生</option>';
            allStudents.forEach(student => {
                const option = document.createElement('option');
                option.value = student.student_id;
                option.textContent = `${student.student_id} - ${student.student_name}`;
                select.appendChild(option);
            });

            // 設定今天為預設日期
            document.getElementById('gradeExamDate').value = new Date().toISOString().split('T')[0];

            modal.classList.add('active');
        }

        // 關閉新增成績模态框
        function closeAddGradeModal() {
            document.getElementById('addGradeModal').classList.remove('active');
            document.getElementById('addGradeForm').reset();
        }

        // 處理新增成績 - 測試模式
        async function handleAddGrade(event) {
            event.preventDefault();
            alert('成績已成功新增！（UI/UX 測試模式 - 不會實際儲存）');
            closeAddGradeModal();
        }

        // 編輯成績（佔位）
        function editGrade(gradeId, studentId) {
            alert(`編輯成績功能（UI/UX 測試模式） (成績ID: ${gradeId})`);
        }

        // 當前選中的班級
        let currentClass = '901';

        // 班級資料（可擴充）
        const classData = {
            '901': {
                name: '九年一班',
                shortName: '901',
                studentCount: 28,
                color: '#6366f1'
            },
            '902': {
                name: '九年二班',
                shortName: '902',
                studentCount: 30,
                color: '#8b5cf6'
            },
            '903': {
                name: '九年三班',
                shortName: '903',
                studentCount: 27,
                color: '#a855f7'
            },
            '904': {
                name: '九年四班',
                shortName: '904',
                studentCount: 29,
                color: '#ec4899'
            }
        };

        // 切換班級
        function switchClass() {
            const selector = document.getElementById('classSelector');
            const newClass = selector.value;

            if (newClass === currentClass) return;

            currentClass = newClass;
            const classInfo = classData[newClass];

            // 更新頁面標題
            document.getElementById('pageTitle').textContent = `${classInfo.name}管理介面 (UI/UX 測試)`;

            // 更新班級徽章
            document.getElementById('classBadgeText').textContent = classInfo.shortName;

            // 更新班級徽章顏色
            const badge = document.getElementById('classBadge');
            badge.style.background = `linear-gradient(135deg, ${classInfo.color} 0%, ${adjustColor(classInfo.color, -20)} 100%)`;

            // 重新載入該班級的學生資料
            loadClassStudents(newClass);

            // 顯示切換提示
            showClassSwitchNotification(classInfo.name);
        }

        // 調整顏色亮度
        function adjustColor(color, amount) {
            const num = parseInt(color.replace("#", ""), 16);
            const r = Math.max(0, Math.min(255, (num >> 16) + amount));
            const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
            const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
            return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }

        // 載入班級學生資料
        function loadClassStudents(classId) {
            // 這裡可以根據班級載入不同的學生資料
            // 目前使用假資料，但可以擴展為從 API 載入
            console.log(`載入 ${classData[classId].name} 的學生資料`);

            // 更新統計卡片中的學生數
            const classInfo = classData[classId];
            document.getElementById('totalStudents').textContent = classInfo.studentCount;

            // 重新載入學生列表
            loadStudents();
        }

        // 顯示班級切換通知
        function showClassSwitchNotification(className) {
            // 創建通知元素
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 2rem;
                background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
                z-index: 10001;
                display: flex;
                align-items: center;
                gap: 0.75rem;
                font-weight: 600;
                animation: slideInRight 0.4s ease;
            `;
            notification.innerHTML = `
                <i class="fas fa-check-circle"></i>
                <span>已切換至 ${className}</span>
            `;

            document.body.appendChild(notification);

            // 3秒後移除
            setTimeout(() => {
                notification.style.animation = 'slideOutRight 0.4s ease';
                setTimeout(() => {
                    notification.remove();
                }, 400);
            }, 3000);
        }

        // 添加動畫樣式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            @keyframes slideOutRight {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // 處理登出
        function handleLogout() {
            if (confirm('確定要登出嗎？')) {
                // 清除所有本地存儲
                localStorage.clear();
                // 重新載入頁面
                window.location.reload();
            }
        }

        // 頁面載入時執行
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            // 初始化班級選擇器
            const classInfo = classData[currentClass];
            const badge = document.getElementById('classBadge');
            if (badge) {
                badge.style.background = `linear-gradient(135deg, ${classInfo.color} 0%, ${adjustColor(classInfo.color, -20)} 100%)`;
            }
            // 更新統計資料
            document.getElementById('totalStudents').textContent = classInfo.studentCount;
        });
    </script>
